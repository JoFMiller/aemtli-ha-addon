# Home-Assistant-Add-on: Ämtli – schlanke PWA-Oberfläche für Grocy.
# Liefert die statische PWA aus und proxyt server-seitig das HA-Grocy-Add-on
# über das interne hassio-Netz (kein Direktport zum Host, kein Tailscale-Umweg).
name: "Ämtli"
version: "2.0.1"
slug: "aemtli"
description: "Schlanke, installierbare PWA für Grocy – Einkaufszettel & Hausarbeiten"
# KEIN 'image:' -> Supervisor baut das Dockerfile lokal.
arch:
  - aarch64
  - amd64
# Basis-Image bringt eigenes s6-Init mit -> kein zusätzliches init.
init: false
startup: services
# Web-UI bequem in der HA-Seitenleiste (hinter HA-Login).
ingress: true
ingress_port: 8099
panel_icon: "mdi:broom"
panel_title: "Ämtli"
# Fester Host-Port für die EIGENSTÄNDIGE, installierbare PWA. Standardmäßig
# nicht zugewiesen (null) – in den Add-on-Einstellungen einen Host-Port setzen.
ports:
  "8080/tcp": null
ports_description:
  "8080/tcp": "Web-UI / installierbare PWA (mit aktiviertem SSL als HTTPS)"
# Lesezugriff auf /ssl für das TLS-Zertifikat der eigenständigen PWA.
map:
  - "ssl:ro"
# Zugriff auf die Supervisor-API – nötig für bashio::dns.host (interner DNS-Resolver).
hassio_api: true
options:
  grocy_upstream: "https://a0d7b954-grocy:80"
  ssl: true
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
  log_level: "info"
schema:
  grocy_upstream: "str"
  ssl: "bool"
  certfile: "str"
  keyfile: "str"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"
