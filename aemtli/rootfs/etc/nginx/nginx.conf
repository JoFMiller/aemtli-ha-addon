# nginx-Hauptkonfiguration für das Ämtli-Add-on.
# Die server-Blöcke (Ingress + Direkt-Port, Resolver, Upstream, SSL) werden
# zur Laufzeit von init-nginx aus den Add-on-Optionen nach /etc/nginx/aemtli.conf
# gerendert und hier eingebunden.
daemon off;            # nginx im Vordergrund -> s6 überwacht den Prozess
user root;             # Worker als root -> keine Schreibrechte-Probleme bei /tmp & Logs
worker_processes 1;
pid /var/run/nginx.pid;
error_log /proc/1/fd/1 info;   # Logs in den Add-on-Log-Stream

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 8m;

    # Temp-Pfade nach /tmp (von init-nginx angelegt)
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    scgi_temp_path /tmp/nginx/scgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;

    # Unter Ingress ist der Basispfad variabel -> Redirects relativ halten.
    absolute_redirect off;
    port_in_redirect off;

    # Dynamisch von init-nginx erzeugt (resolver + beide server-Blöcke).
    include /etc/nginx/aemtli.conf;
}
