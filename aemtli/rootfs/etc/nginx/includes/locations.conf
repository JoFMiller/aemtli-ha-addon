# Gemeinsame location-Blöcke für beide server (Ingress 8099 + Direkt-Port 8080).
# $grocy_upstream und $grocy_host werden je server von init-nginx per `set` gesetzt.

# Korrekter MIME-Type fürs PWA-Manifest.
location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/includes/security-headers.conf;
}

# Icons lange cachen (^~ schlägt die /grocy/-Regex, falls je nötig).
location ^~ /icons/ {
    add_header Cache-Control "public, max-age=604800";
    include /etc/nginx/includes/security-headers.conf;
}

# Reverse-Proxy auf das HA-Grocy-Add-on – server-seitig über das interne
# hassio-Netz. Der pro-Person gesetzte GROCY-API-KEY-Header des Clients wird
# unverändert durchgereicht (kein Key im Add-on gespeichert). Variable
# proxy_pass + http-resolver -> Grocy-IP wird zur Laufzeit aufgelöst (robust
# gegen Neustart/IP-Wechsel des Grocy-Add-ons).
location ~ ^/grocy/(?<grocy_path>.*)$ {
    proxy_pass $grocy_upstream/$grocy_path$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $grocy_host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_ssl_server_name on;     # SNI für das Grocy-Add-on-Zertifikat
    proxy_ssl_verify off;         # Grocy-Add-on nutzt i.d.R. ein Self-Signed-Zert
    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;
    # Ist Grocy weg (Add-on gestoppt, startet neu, DNS), liefert nginx sonst eine
    # HTML-Fehlerseite. Die App bekommt stattdessen JSON + einen Marker-Header.
    proxy_intercept_errors on;
    error_page 502 503 504 = @grocy_down;
}
location @grocy_down {
    default_type application/json;
    add_header X-Aemtli-Proxy "down" always;
    add_header Cache-Control "no-store" always;
    return 502 '{"error_message":"Grocy ist über den Ämtli-Proxy nicht erreichbar","aemtli_proxy":"down"}';
}

# PWA / Single-Page-Fallback. Alle App-Dateien (index.html, app.js, boot.js,
# sw.js, config.js) nicht hart cachen -> Updates kommen sofort an; der Service
# Worker liefert sie offline aus seinem eigenen Cache.
location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/includes/security-headers.conf;
    try_files $uri $uri/ /index.html;
}
