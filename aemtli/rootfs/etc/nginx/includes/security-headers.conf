# Sicherheits-Header. nginx vererbt add_header NICHT in Locations, die ein
# eigenes add_header haben -> diese Datei in JEDE solche Location einbinden.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Die App lädt nur eigene Dateien; Inline-Styles (style="…") sind erlaubt,
# Inline-Skripte nicht (boot.js/app.js sind extern). connect-src erlaubt
# zusätzlich https:/http:, weil in den Einstellungen eine eigene Grocy-Adresse
# eingetragen werden kann. frame-ancestors 'self' deckt HA-Ingress ab (Iframe
# und Seite laufen dort auf derselben Origin).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http:; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'" always;
