# Sicherheits-Header. nginx vererbt add_header NICHT in Locations, die ein
# eigenes add_header haben -> diese Datei in JEDE solche Location einbinden.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Die App lädt nur eigene Dateien; Inline-Styles (style="…") sind erlaubt.
# Einziges Inline-Skript ist der Trailing-Slash-Redirect im <head> von index.html,
# freigegeben über seinen sha256-Hash (bei Änderung des Snippets neu berechnen:
#   printf '%s' "<snippet>" | openssl dgst -sha256 -binary | base64). connect-src erlaubt
# zusätzlich https:/http:, weil in den Einstellungen eine eigene Grocy-Adresse
# eingetragen werden kann. frame-ancestors 'self' deckt HA-Ingress ab (Iframe
# und Seite laufen dort auf derselben Origin).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-DEy3IFFNp4gqBBZ2NoaG7lmta4ExDbQbOzhAteeGVSM='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http:; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'" always;
