# Gemeinsame Proxy-Einstellungen für Open Food Facts (siehe locations.conf).
# $off_host wird in der jeweiligen location gesetzt. Antworten werden gecacht,
# weil OFF pro IP nur 15 Produktabrufe und 10 Suchen pro Minute erlaubt.
proxy_http_version 1.1;
proxy_set_header Host $off_host;
proxy_set_header Connection "";
proxy_set_header User-Agent "Aemtli/2.1 (https://github.com/JoFMiller/aemtli-ha-addon)";
proxy_set_header Accept "application/json";
proxy_set_header Accept-Encoding "";
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_read_timeout 15s;
proxy_connect_timeout 8s;
proxy_cache off_cache;
proxy_cache_key "$off_host$uri$is_args$args";
proxy_cache_valid 200 7d;
proxy_cache_valid 404 1h;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504 http_429;
proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
proxy_hide_header Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;
proxy_intercept_errors on;
error_page 429 502 503 504 = @off_down;
add_header Cache-Control "private, max-age=3600";
add_header X-Aemtli-Cache $upstream_cache_status;
include /etc/nginx/includes/security-headers.conf;
